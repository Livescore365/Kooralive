<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE SCORE - Football Scores & Fixtures</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    header {
      background: #071521;
      color: white;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .logo span {
      color: #32df79;
    }

    .subtitle {
      font-size: 13px;
      color: #cbd5dc;
      margin-top: 4px;
    }

    nav {
      background: #0c1d2b;
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 15px;
      overflow-x: auto;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }

    nav a:hover {
      color: #32df79;
    }

    .hero {
      background: linear-gradient(135deg, #071521, #123d5c);
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: #32df79;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #dce5ea;
    }

    .search {
      width: 90%;
      max-width: 650px;
      padding: 16px 20px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section-title h2 {
      font-size: 24px;
    }

    .live-title {
      color: #e63946;
    }

    .match {
      background: white;
      margin-bottom: 8px;
      padding: 18px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: 80px 1fr 100px 1fr;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .time {
      font-weight: bold;
      color: #e63946;
    }

    .team {
      font-size: 17px;
      font-weight: bold;
    }

    .score {
      background: #071521;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .league {
      color: #65727c;
      font-size: 13px;
    }

    footer {
      margin-top: 50px;
      background: #071521;
      color: white;
      text-align: center;
      padding: 30px;
    }

    footer span {
      color: #32df79;
    }

    @media (max-width: 650px) {
      .hero h1 {
        font-size: 32px;
      }

      .match {
        grid-template-columns: 60px 1fr 65px 1fr;
        padding: 13px 8px;
      }

      .team {
        font-size: 14px;
      }

      .league {
        display: none;
      }

      nav {
        justify-content: flex-start;
      }
    }/* ===== ARABIC PROFESSIONAL DESIGN ===== */
